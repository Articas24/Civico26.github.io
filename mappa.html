// =====================================================
// CREAZIONE MAPPA
// =====================================================

const map = L.map('map').setView(

    [38.1110, 15.6451],

    13

);



// =====================================================
// MAPPA OPENSTREETMAP
// =====================================================

L.tileLayer(

    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

    {

        maxZoom: 19,

        attribution:
        '&copy; OpenStreetMap contributors'

    }

).addTo(map);



// =====================================================
// LINK GOOGLE MAPS
// =====================================================

function googleMapsLink(query) {

    return (

        'https://www.google.com/maps/search/?api=1&query=' +

        encodeURIComponent(query)

    );

}



// =====================================================
// FUNZIONE PER CREARE I MARKER
// =====================================================

function addMarker(

    lat,

    lon,

    titolo,

    descrizione,

    mapsQuery

) {


    const contenuto =

        '<strong>' +

        titolo +

        '</strong><br>' +

        descrizione +

        '<br>' +

        '<a class="maps-button" ' +

        'href="' +

        googleMapsLink(mapsQuery) +

        '" ' +

        'target="_blank">' +

        '📍 Apri in Google Maps' +

        '</a>';


    L.marker([lat, lon])

        .addTo(map)

        .bindPopup(contenuto);


}
