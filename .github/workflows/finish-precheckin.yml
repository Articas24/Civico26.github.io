name: Finish pre-checkin integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finish-precheckin.yml']
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire admin and privacy text
        run: |
          python - <<'PY'
          from pathlib import Path

          # Fix birth-country conditional refresh without interrupting typing.
          p=Path('precheckin.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("guests[i][field]=e.target.value;if(field==='birth_country')render()});", "guests[i][field]=e.target.value});")
          s=s.replace("if(card&&e.target.dataset.field)guests[Number(card.dataset.guest)][e.target.dataset.field]=e.target.value});", "if(card&&e.target.dataset.field){const i=Number(card.dataset.guest),field=e.target.dataset.field;guests[i][field]=e.target.value;if(field==='birth_country')render()}});")
          s=s.replace("è inoltre prevista una scadenza tecnica massima di 24 ore.", "la scadenza automatica della foto è impostata a 24 ore.")
          s=s.replace("with a technical maximum retention period of 24 hours.", "and the photo is set to expire automatically after 24 hours.")
          p.write_text(s,encoding='utf-8')

          # Load the admin module after the existing enhancements.
          a=Path('admin.html')
          html=a.read_text(encoding='utf-8')
          tag='<script src="admin-precheckin.js?v=20260824-1603"></script>'
          if 'admin-precheckin.js' not in html:
              html=html.replace('<script src="admin-enhance.js?v=20260821-1544"></script>', '<script src="admin-enhance.js?v=20260821-1544"></script>\n'+tag, 1)
          a.write_text(html,encoding='utf-8')

          # Extend privacy notice for legal guest registration and temporary document photo.
          pr=Path('privacy.html')
          x=pr.read_text(encoding='utf-8')
          needle='<p>Il sito salva inoltre nel browser la preferenza della lingua tramite <em>localStorage</em>. Questa preferenza non è utilizzata per profilazione o pubblicità.</p>'
          add=needle+'<p>Quando utilizzi il pre-check-in per una prenotazione confermata trattiamo inoltre i dati anagrafici richiesti per gli adempimenti di pubblica sicurezza e statistico-turistici (tra cui nome, cognome, sesso, data e luogo di nascita, cittadinanza e residenza) e, per l’ospite principale, gli estremi del documento di identità. La foto del documento è trattata separatamente in un’area privata esclusivamente per la verifica e non viene resa pubblica.</p>'
          if 'Quando utilizzi il pre-check-in' not in x:
              x=x.replace(needle,add,1)
          old='<section><h2>6. Conservazione</h2><p>Le richieste che non si trasformano in una prenotazione vengono conservate per il tempo necessario alla loro gestione e, di regola, non oltre 12 mesi. I dati relativi a prenotazioni effettivamente confermate possono essere conservati più a lungo quando necessario per adempiere a obblighi fiscali, amministrativi, contabili o di pubblica sicurezza previsti dalla legge.</p></section>'
          new='<section><h2>6. Conservazione</h2><p>Le richieste che non si trasformano in una prenotazione vengono conservate per il tempo necessario alla loro gestione e, di regola, non oltre 12 mesi. I dati relativi a prenotazioni effettivamente confermate possono essere conservati più a lungo quando necessario per adempiere a obblighi fiscali, amministrativi, contabili, statistico-turistici o di pubblica sicurezza previsti dalla legge.</p><p><strong>Foto del documento:</strong> è conservata separatamente dai dati anagrafici in uno spazio privato e temporaneo. Viene eliminata quando il gestore conclude la verifica; il sistema imposta inoltre una scadenza automatica a 24 ore. Dopo l’eliminazione non viene mantenuta una copia della foto nel database del pre-check-in.</p></section>'
          x=x.replace(old,new,1)
          enneedle='<p>The main legal basis is taking steps at your request before entering into a contract (Article 6(1)(b) GDPR). Legal obligations may apply to confirmed bookings, and limited technical processing may be based on legitimate interests in running and securing the website.</p>'
          enadd=enneedle+'<p>For confirmed bookings, the pre-check-in may also process the identification data required for public-security and tourism-statistics obligations. The lead guest’s document details are collected, while the document photo is handled separately in private temporary storage solely for verification.</p>'
          if 'private temporary storage solely for verification' not in x:
              x=x.replace(enneedle,enadd,1)
          enold='<section><h2>Retention and rights</h2><p>Enquiries that do not become bookings are generally kept no longer than 12 months. Confirmed booking data may be retained for longer where required by applicable legal, tax, accounting or public-security obligations.</p>'
          ennew='<section><h2>Retention and rights</h2><p>Enquiries that do not become bookings are generally kept no longer than 12 months. Confirmed booking data may be retained for longer where required by applicable legal, tax, accounting, tourism-statistics or public-security obligations.</p><p><strong>Document photo:</strong> it is kept separately in private temporary storage, deleted when verification is completed, and is set to expire automatically after 24 hours. The pre-check-in database does not retain a copy of the photo after deletion.</p>'
          x=x.replace(enold,ennew,1)
          x=x.replace('Ultimo aggiornamento: 21 agosto 2026.','Ultimo aggiornamento: 24 agosto 2026.')
          x=x.replace('Last updated: 21 August 2026.','Last updated: 24 August 2026.')
          pr.write_text(x,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add precheckin.js admin.html privacy.html
          git commit -m "Wire secure pre-checkin into admin and privacy"
          git push
