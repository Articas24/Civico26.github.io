name: Bump precheckin notification cache
on:
  push:
    paths:
      - '.github/workflows/bump-precheckin-notify.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check admin-precheckin-notify.js
      - name: Bump loader
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          s=s.replace('admin-precheckin-notify.js?v=20260825-0635','admin-precheckin-notify.js?v=20260825-1625')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Bump pre-check-in notification cache'
          git push
