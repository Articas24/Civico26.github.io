name: Expose separate compliance buttons
on:
  push:
    paths:
      - '.github/workflows/expose-compliance-separate-buttons.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show separate first-run buttons
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin-compliance-oneclick.js')
          s=p.read_text()
          old='''<details style="margin-top:8px"><summary style="font-size:10px;font-weight:800;cursor:pointer">Invio separato / recupero</summary><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:7px"><button type="button" class="btn light small" id="ocSendAw" ${(!c.alloggiati||!verified||!dateOk)?'disabled':''}>Solo Questura</button><button type="button" class="btn light small" id="ocSendRoss" ${(!c.ross1000||!verified||!e||today()<e.start_date)?'disabled':''}>Aggiorna ROSS1000</button></div></details>'''
          new='''<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><button type="button" class="btn light small" id="ocSendAw" ${(!c.alloggiati||!verified||!dateOk)?'disabled':''}>Solo Questura</button><button type="button" class="btn light small" id="ocSendRoss" ${(!c.ross1000||!verified||!e||today()<e.start_date)?'disabled':''}>Solo ROSS1000</button></div><div class="oc-note">Per il primo collaudo reale usa i due pulsanti separati. Dopo aver verificato entrambi sui portali ufficiali potrai usare normalmente il pulsante unico.</div>'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1))
          a=Path('admin.html')
          h=a.read_text()
          h=h.replace('admin-compliance-oneclick.js?v=20260825-0544','admin-compliance-oneclick.js?v=20260825-0602')
          a.write_text(h)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-compliance-oneclick.js admin.html
          git commit -m 'Show separate compliance send buttons'
          git push
