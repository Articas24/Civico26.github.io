name: Switch check-in URL
on:
  push:
    paths:
      - '.github/workflows/switch-checkin-url.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch generated link and bump admin script
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin-precheckin.js')
          s=p.read_text()
          s=s.replace("new URL('precheckin.html',location.href)","new URL('checkin-ospiti.html',location.href)")
          p.write_text(s)
          h=Path('admin.html')
          x=h.read_text()
          x=x.replace('admin-precheckin.js?v=20260824-1603','admin-precheckin.js?v=20260824-1718')
          h.write_text(x)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-precheckin.js admin.html
          git commit -m 'Use cache-safe guest check-in page'
          git push
