name: One-shot safe homepage declutter

on:
  push:
    branches:
      - agent/home-declutter-2026-08-19

permissions:
  contents: write

jobs:
  patch-home:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-declutter-2026-08-19
          fetch-depth: 0
      - name: Safely declutter homepage
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          def exact(old, new, label):
              global text
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 exact match, found {n}')
              text = text.replace(old, new, 1)

          def regex(pattern, replacement, label):
              global text
              text2, n = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 regex match, found {n}')
              text = text2

          # Remove FAQ structured data because FAQ content moves to faq.html.
          regex(r'\n<script type="application/ld\+json">\s*\{\s*"@context": "https://schema.org",\s*"@type": "FAQPage".*?</script>', '', 'FAQ JSON-LD')

          exact(
              '<a href="#soggiorno">Il tuo soggiorno</a>\n<a href="#scopri">Scopri</a></nav>',
              '<a href="soggiorno.html">Il tuo soggiorno</a>\n<a href="guida-reggio-calabria.html">Scopri</a></nav>',
              'desktop navigation'
          )

          old_location = '<div class="location-links"><a class="maplink" href="#reggio">Scopri Reggio Calabria →</a><a class="maplink" href="#parcheggio">Dove parcheggiare →</a><a class="maplink" href="#mare">Mare e spiagge →</a></div>'
          new_location = '<div class="location-links"><a class="maplink" href="posizione.html">Approfondisci posizione →</a><a class="maplink" href="parcheggio.html">Dove parcheggiare →</a><a class="maplink" href="mare.html">Mare e spiagge →</a></div>'
          exact(old_location, new_location, 'location links')

          compact = '''<section id="soggiorno-preview">
<div class="wrap">
<div class="section-head"><span class="eyebrow">Guida ospiti</span><h2>Il tuo soggiorno</h2><p>Check-in, Wi-Fi, climatizzazione, acqua, raccolta differenziata, regole e contatti sono raccolti in una pagina pratica da consultare anche durante il soggiorno.</p></div>
<div class="content-grid"><div class="info-card wide"><div class="icon">🔑</div><h3>Tutto ciò che serve, senza appesantire la home</h3><p>Apri la guida ospiti per trovare rapidamente accesso alla casa, istruzioni, regole, parcheggio e numeri utili.</p><a class="maplink" href="soggiorno.html">Apri Il tuo soggiorno →</a></div></div>
</div>
</section>
<section id="scopri" style="padding-top:20px">
<div class="wrap">
<div class="section-head"><span class="eyebrow">Esplora</span><h2>Scopri Reggio e dintorni</h2><p>Dalla home scegli ciò che ti interessa e apri la guida dedicata, senza scorrere un'unica pagina interminabile.</p></div>
<div class="cards">
<a class="card" href="reggio.html"><div class="card-bg reggio" style="background-image:url('immagini/lungomare-falcomata.jpg')"></div><div class="card-icon">🏛️</div><div class="card-content"><div class="card-kicker">Da vedere</div><h3>Reggio Calabria</h3><p>Museo, Lungomare, centro storico e monumenti.</p><div class="arrow">Apri la guida →</div></div></a>
<a class="card" href="mare.html"><div class="card-bg sea" style="background-image:url('immagini/scilla.jpg')"></div><div class="card-icon">🏖️</div><div class="card-content"><div class="card-kicker">Costa Viola</div><h3>Mare e spiagge</h3><p>Scilla, Bagnara e Palmi.</p><div class="arrow">Apri la guida →</div></div></a>
<a class="card" href="mangiare.html"><div class="card-bg food" style="background-image:url('immagini/gelateria-cesare.jpg')"></div><div class="card-icon">🍝</div><div class="card-content"><div class="card-kicker">Sapori locali</div><h3>Dove mangiare</h3><p>Bar, gelaterie, pizzerie, trattorie e ristoranti.</p><div class="arrow">Apri la guida →</div></div></a>
<a class="card" href="aspromonte.html"><div class="card-bg mountain" style="background-image:url('immagini/aspromonte.jpg')"></div><div class="card-icon">🌲</div><div class="card-content"><div class="card-kicker">Natura</div><h3>Aspromonte</h3><p>Gambarie, boschi e montagna reggina.</p><div class="arrow">Apri la guida →</div></div></a>
<a class="card" href="itinerari.html"><div class="card-bg city" style="background-image:url('immagini/via-marina.jpg')"></div><div class="card-icon">🧭</div><div class="card-content"><div class="card-kicker">Organizza le giornate</div><h3>Itinerari</h3><p>Reggio, Scilla, weekend senza auto e Aspromonte.</p><div class="arrow">Scegli itinerario →</div></div></a>
<a class="card" href="parcheggio.html"><div class="card-bg parking"></div><div class="card-icon">🚗</div><div class="card-content"><div class="card-kicker">Informazioni utili</div><h3>Parcheggio</h3><p>Mappa e indicazioni per la sosta vicino a Civico 26.</p><div class="arrow">Guarda la mappa →</div></div></a>
<a class="card" href="preferiti.html"><div class="card-bg food"></div><div class="card-icon">❤️</div><div class="card-content"><div class="card-kicker">Scelti da noi</div><h3>I nostri preferiti</h3><p>I posti e le esperienze che consiglieremmo a un amico.</p><div class="arrow">Scopri →</div></div></a>
<a class="card" href="arte.html"><div class="card-bg art" style="background-image:url('immagini/arte-civico26.jpg');background-position:center;background-size:cover;"></div><div class="card-icon">🖼️</div><div class="card-content"><div class="card-kicker">Cultura &amp; creatività</div><h3>Arte al Civico 26</h3><p>Scopri l'opera esposta nell'appartamento e l'artista.</p><div class="arrow">Scopri →</div></div></a>
<a class="card" href="guida-reggio-calabria.html" style="grid-column:1/-1"><div class="card-bg city" style="background-image:url('immagini/lungomare-falcomata.jpg')"></div><div class="card-icon">📖</div><div class="card-content"><div class="card-kicker">Tutto in un punto</div><h3>Guida di Reggio Calabria</h3><p>La pagina-hub con tutti i collegamenti per organizzare il soggiorno.</p><div class="arrow">Apri la guida completa →</div></div></a>
</div>
</div>
</section>'''

          regex(r'<section id="soggiorno">.*?</section>\s*<section class="faq-section" id="faq">.*?</section>\s*<section id="scopri" style="padding-top:20px">.*?</section>', compact, 'stay + FAQ + discover block')

          for section_id in ['reggio','mare','mangiare','aspromonte','preferiti','arte']:
              regex(r'<section class="detail-section" id="' + section_id + r'">.*?</section>', '', f'remove duplicated {section_id} section')

          exact('<a href="#scopri"><span class="nav-ico">🧭</span><span>Scopri</span></a>', '<a href="guida-reggio-calabria.html"><span class="nav-ico">🧭</span><span>Scopri</span></a>', 'mobile discover link')

          exact('<a href="#posizione">Posizione</a><a href="#faq">FAQ</a>', '<a href="posizione.html">Posizione</a><a href="faq.html">FAQ</a>', 'footer property links')
          exact('<a href="#reggio">Reggio Calabria</a><a href="#mare">Mare e spiagge</a><a href="#aspromonte">Aspromonte</a><a href="#mangiare">Dove mangiare</a><a href="#parcheggio">Parcheggio</a>', '<a href="reggio.html">Reggio Calabria</a><a href="mare.html">Mare e spiagge</a><a href="aspromonte.html">Aspromonte</a><a href="mangiare.html">Dove mangiare</a><a href="parcheggio.html">Parcheggio</a>', 'footer guide links')

          marker = 'const originals = new Map();'
          if text.count(marker) != 1:
              raise SystemExit('translation marker is not unique')
          extra = '''Object.assign(translations, {
            "Guida ospiti":"Guest guide",
            "Check-in, Wi-Fi, climatizzazione, acqua, raccolta differenziata, regole e contatti sono raccolti in una pagina pratica da consultare anche durante il soggiorno.":"Check-in, Wi-Fi, air conditioning, water, recycling, rules and contacts are collected in a practical page to use during your stay.",
            "Tutto ciò che serve, senza appesantire la home":"Everything you need, without cluttering the homepage",
            "Apri Il tuo soggiorno →":"Open your stay guide →",
            "Scopri Reggio e dintorni":"Explore Reggio and surroundings",
            "Dalla home scegli ciò che ti interessa e apri la guida dedicata, senza scorrere un'unica pagina interminabile.":"Choose what interests you and open the dedicated guide instead of scrolling through one endless page.",
            "Apri la guida →":"Open guide →",
            "Itinerari":"Itineraries",
            "Parcheggio":"Parking",
            "Guida di Reggio Calabria":"Reggio Calabria guide",
            "Apri la guida completa →":"Open the complete guide →"
          });
          '''
          text = text.replace(marker, extra + marker, 1)

          # Safety: the home must still contain the commercial core and must no longer contain duplicated guide sections.
          required = ['id="prenota"','id="casa"','id="posizione"','id="scopri"','const SUPABASE_URL','submit_booking_request','class="house-lightbox"','soggiorno.html','faq.html','reggio.html','mare.html','mangiare.html','aspromonte.html']
          for item in required:
              if item not in text:
                  raise SystemExit(f'safety check failed, missing {item}')
          forbidden = ['id="faq"','class="detail-section" id="reggio"','class="detail-section" id="mare"','class="detail-section" id="mangiare"','class="detail-section" id="aspromonte"','class="detail-section" id="preferiti"','class="detail-section" id="arte"']
          for item in forbidden:
              if item in text:
                  raise SystemExit(f'duplicate section remains: {item}')
          if len(text) >= len(original):
              raise SystemExit('homepage did not get shorter as expected')

          path.write_text(text, encoding='utf-8')

      - name: Commit patch and remove one-shot workflow
        run: |
          rm .github/workflows/home-declutter-safe.yml
          git config user.name "Civico26 safe patch"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/home-declutter-safe.yml
          git diff --cached --check
          git commit -m "Declutter homepage and link dedicated guides"
          git push origin HEAD:agent/home-declutter-2026-08-19
