name: Inject admin hotfix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inject-admin-hotfix.yml']
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject cache-safe hotfix before admin enhance
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          text=p.read_text(encoding='utf-8')
          hot='<script src="admin-hotfix.js?v=20260824-1358"></script>'
          if 'admin-hotfix.js' not in text:
              needle='<script src="admin-enhance.js?v=20260821-1544"></script>'
              if needle not in text:
                  raise SystemExit('admin-enhance script tag not found')
              text=text.replace(needle,hot+'\n'+needle,1)
              p.write_text(text,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          git commit -m "Load cache-safe admin hotfix before enhancements"
          git push