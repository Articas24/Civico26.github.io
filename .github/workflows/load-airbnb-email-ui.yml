name: Load Booking Airbnb email UI
on:
  push:
    paths:
      - '.github/workflows/load-airbnb-email-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check admin-outlook-sync.js
      - name: Add fresh direct loader
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          needle='<script src="admin-costs-correct.js?v=20260825-0635"></script>'
          add=needle+'\n<script src="admin-outlook-sync.js?v=20260825-0640"></script>'
          if 'admin-outlook-sync.js?v=20260825-0640' not in s:
              if needle not in s: raise SystemExit('admin end loader not found')
              s=s.replace(needle,add,1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Load fresh Booking Airbnb email automation UI'
          git push
