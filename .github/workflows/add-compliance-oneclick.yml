name: Add compliance one-click UI
on:
  push:
    paths:
      - '.github/workflows/add-compliance-oneclick.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load one-click admin UI
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          needle='<script src="admin-alloggiati-official-test.js?v=20260824-2108"></script>'
          add=needle+'\n<script src="admin-compliance-oneclick.js?v=20260825-0535"></script>'
          if 'admin-compliance-oneclick.js' not in s:
              s=s.replace(needle,add)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Load one-click compliance admin UI'
          git push
