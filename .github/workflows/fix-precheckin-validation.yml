name: Fix pre-check-in validation
on:
  push:
    paths:
      - '.github/workflows/fix-precheckin-validation.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch validation
        shell: python
        run: |
          from pathlib import Path
          p=Path('precheckin.js')
          s=p.read_text()
          old="""function validate(){
 for(let i=0;i<guests.length;i++){const g=guests[i];for(const k of ['first_name','last_name','sex','birth_date','birth_country','citizenship','residence_country','residence_city'])if(!String(g[k]||'').trim())return false;if(isItaly(g.birth_country)&&(!g.birth_city||!g.birth_province))return false;if(i===0&&(!g.document_type||!g.document_number||!g.document_issuer))return false}return true
}
async function submit(){
 clearNotice();if(!validate())return notice(T('required'));if(!hasPhoto&&!photoFile)return notice(T('photoRequired'));if(!q('#privacyOk').checked)return notice(T('privacyRequired'));
"""
          new="""const validationLabels={first_name:'first',last_name:'last',sex:'sex',birth_date:'birthDate',birth_country:'birthCountry',birth_city:'birthCity',birth_province:'birthProvince',citizenship:'citizenship',residence_country:'resCountry',residence_city:'resCity',document_type:'docType',document_number:'docNumber',document_issuer:'docIssuer'};
function syncDomToState(){
 document.querySelectorAll('[data-guest]').forEach(card=>{const i=Number(card.dataset.guest);if(!Number.isInteger(i)||!guests[i])return;card.querySelectorAll('[data-field]').forEach(el=>{guests[i][el.dataset.field]=el.value})})
}
function validate(){
 syncDomToState();
 for(let i=0;i<guests.length;i++){
  const g=guests[i];
  for(const k of ['first_name','last_name','sex','birth_date','birth_country','citizenship','residence_country','residence_city'])if(!String(g[k]||'').trim())return {ok:false,index:i,field:k};
  if(isItaly(g.birth_country)&&!String(g.birth_city||'').trim())return {ok:false,index:i,field:'birth_city'};
  if(isItaly(g.birth_country)&&!String(g.birth_province||'').trim())return {ok:false,index:i,field:'birth_province'};
  if(i===0){for(const k of ['document_type','document_number','document_issuer'])if(!String(g[k]||'').trim())return {ok:false,index:i,field:k}}
 }
 return {ok:true};
}
function showValidationError(v){
 const el=q(`[data-guest="${v.index}"] [data-field="${v.field}"]`);if(el){el.style.borderColor='#b44';el.style.boxShadow='0 0 0 3px rgba(180,68,68,.12)';el.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>el.focus({preventScroll:true}),350)}
 const label=T(validationLabels[v.field]||v.field);notice(`${T('required')} ${lang==='en'?'Missing:':'Campo mancante:'} ${label}.`)
}
async function submit(){
 clearNotice();const validation=validate();if(!validation.ok)return showValidationError(validation);if(!hasPhoto&&!photoFile)return notice(T('photoRequired'));if(!q('#privacyOk').checked)return notice(T('privacyRequired'));
"""
          if old not in s:
              raise SystemExit('validation block not found')
          s=s.replace(old,new)
          old2="""q('#guests').addEventListener('input',e=>{const card=e.target.closest('[data-guest]');if(!card||!e.target.dataset.field)return;const i=Number(card.dataset.guest),field=e.target.dataset.field;guests[i][field]=e.target.value});
 q('#guests').addEventListener('change',e=>{if(e.target.id==='photoInput'){photoFile=e.target.files?.[0]||null;render();return}const card=e.target.closest('[data-guest]');if(card&&e.target.dataset.field){const i=Number(card.dataset.guest),field=e.target.dataset.field;guests[i][field]=e.target.value;if(field==='birth_country')render()}});
"""
          new2="""q('#guests').addEventListener('input',e=>{const card=e.target.closest('[data-guest]');if(!card||!e.target.dataset.field)return;const i=Number(card.dataset.guest),field=e.target.dataset.field;guests[i][field]=e.target.value;e.target.style.borderColor='';e.target.style.boxShadow=''});
 q('#guests').addEventListener('change',e=>{if(e.target.id==='photoInput'){syncDomToState();photoFile=e.target.files?.[0]||null;render();return}const card=e.target.closest('[data-guest]');if(card&&e.target.dataset.field){const i=Number(card.dataset.guest),field=e.target.dataset.field;guests[i][field]=e.target.value;e.target.style.borderColor='';e.target.style.boxShadow='';if(field==='birth_country'){syncDomToState();render()}}});
"""
          if old2 not in s:
              raise SystemExit('event block not found')
          s=s.replace(old2,new2)
          p.write_text(s)
          h=Path('precheckin.html')
          x=h.read_text()
          x=x.replace('precheckin.js?v=20260824-1603','precheckin.js?v=20260824-1712')
          h.write_text(x)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add precheckin.js precheckin.html
          git commit -m 'Fix pre-check-in required field validation'
          git push
