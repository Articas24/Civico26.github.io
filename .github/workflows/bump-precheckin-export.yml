name: Bump pre-check-in export cache
on:
  push:
    paths:
      - '.github/workflows/bump-precheckin-export.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump script version
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          s=s.replace('admin-precheckin-export.js?v=20260824-1655','admin-precheckin-export.js?v=20260824-1726')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Load no-send pre-check-in validator'
          git push