name: Validate and publish compliance modal fix
on:
  push:
    paths:
      - '.github/workflows/bump-compliance-fix.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: node --check admin-compliance-oneclick.js
      - name: Bump cache version
        run: sed -i 's/admin-compliance-oneclick.js?v=20260825-0602/admin-compliance-oneclick.js?v=20260825-1629/' admin.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Bump compliance modal bugfix cache'
          git push
