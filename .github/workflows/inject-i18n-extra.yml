name: Inject extended guest i18n
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inject-i18n-extra.yml']
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject extended i18n loader
        run: |
          python - <<'PY'
          from pathlib import Path
          tag='<script src="site-i18n-extra.js?v=20260824-1335"></script>'
          for name in ['mappa.html','posizione.html','reggio.html']:
              p=Path(name)
              if not p.exists(): continue
              text=p.read_text(encoding='utf-8')
              if 'site-i18n-extra.js' in text: continue
              text=text.replace('</body>',tag+'\n</body>',1)
              p.write_text(text,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mappa.html posizione.html reggio.html
          git commit -m "Complete English support on map and location pages"
          git push
