name: Polish home card layout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restructure-home-guide.yml']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pair favourites and Reggio guide cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('_includes/home-4.html')
          text=p.read_text(encoding='utf-8')
          old='<a class="card" href="guida-reggio-calabria.html" style="grid-column:1/-1">'
          new='<a class="card" href="guida-reggio-calabria.html">'
          if old in text:
              text=text.replace(old,new,1)
              p.write_text(text,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _includes/home-4.html
          git commit -m "Balance Explore cards after home restructure"
          git push