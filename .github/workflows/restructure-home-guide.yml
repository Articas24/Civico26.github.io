name: Restructure home guest guide
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restructure-home-guide.yml']
permissions:
  contents: write
jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move parking FAQ and art into guest guide
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('_includes/home-4.html')
          text=p.read_text(encoding='utf-8')

          parking='''<a class="card" href="parcheggio.html"><div class="card-bg parking" style="background-image:var(--card-parcheggio)"></div><div class="card-icon">🚗</div><div class="card-content"><div class="card-kicker">Informazioni utili</div><h3>Parcheggio</h3><p>Mappa e indicazioni per la sosta vicino a Civico 26.</p><div class="arrow">Guarda la mappa →</div></div></a>'''
          faq='''<a class="card" href="faq.html"><div class="card-bg city" style="background-image:var(--card-faq)"></div><div class="card-icon">❓</div><div class="card-content"><div class="card-kicker">Prima di prenotare</div><h3>Domande frequenti</h3><p>Capienza, servizi, posizione, animali e prenotazione.</p><div class="arrow">Leggi le FAQ →</div></div></a>'''
          art='''<a class="card" href="arte.html"><div class="card-bg art" style="background-image:url('immagini/arte-civico26.jpg')"></div><div class="card-icon">🖼️</div><div class="card-content"><div class="card-kicker">Cultura &amp; creatività</div><h3>Arte al Civico 26</h3><p>Scopri l'opera esposta nell'appartamento e l'artista.</p><div class="arrow">Scopri →</div></div></a>'''

          old='''<section class="preview-section" id="soggiorno-preview"><div class="wrap"><div class="section-head"><span class="eyebrow">Informazioni pratiche</span><h2>Guida ospiti</h2><p>Tutte le informazioni pratiche da avere a portata di mano prima e durante il soggiorno a Civico 26.</p></div><div class="preview-card"><div class="preview-icon">🔑</div><div><h3>Check-in, Wi‑Fi, acqua, climatizzazione, regole e contatti</h3><p>Tutto ciò che serve prima e durante il soggiorno, compresi parcheggio, raccolta differenziata, autoclave e numeri utili.</p><a class="maplink" href="soggiorno.html">Apri Guida ospiti →</a></div></div></div></section>'''
          new=f'''<section class="preview-section" id="soggiorno-preview"><div class="wrap"><div class="section-head"><span class="eyebrow">Informazioni pratiche</span><h2>Guida ospiti</h2><p>Tutte le informazioni pratiche da avere a portata di mano prima e durante il soggiorno a Civico 26.</p></div><div class="cards" style="grid-template-columns:1fr;margin-bottom:22px">{parking}</div><div class="preview-card"><div class="preview-icon">🔑</div><div><h3>Check-in, Wi‑Fi, acqua, climatizzazione, regole e contatti</h3><p>Tutto ciò che serve prima e durante il soggiorno: raccolta differenziata, autoclave, climatizzazione, regole e numeri utili.</p><a class="maplink" href="soggiorno.html">Apri Guida ospiti →</a></div></div><div class="cards" style="margin-top:28px">{faq}{art}</div></div></section>'''
          if old not in text:
              raise SystemExit('guest guide section not found')
          text=text.replace(old,new,1)
          for card in (parking,faq,art):
              # remove the copy still present in Explore, leaving the newly inserted guide copy intact
              first=text.find(card)
              second=text.find(card,first+len(card))
              if second==-1:
                  raise SystemExit('expected duplicate card not found')
              text=text[:second]+text[second+len(card):]
          p.write_text(text,encoding='utf-8')

          i=Path('home-i18n.js')
          js=i.read_text(encoding='utf-8')
          old_it='"Tutto ciò che serve prima e durante il soggiorno, compresi parcheggio, raccolta differenziata, autoclave e numeri utili.":"Everything you need before and during your stay, including parking, recycling, the water pump and useful contacts."'
          new_it='"Tutto ciò che serve prima e durante il soggiorno: raccolta differenziata, autoclave, climatizzazione, regole e numeri utili.":"Everything you need before and during your stay: recycling, the water pump, air conditioning, house rules and useful contacts."'
          if old_it in js:
              js=js.replace(old_it,new_it,1)
          i.write_text(js,encoding='utf-8')

          h=Path('_includes/home-5.html')
          html=h.read_text(encoding='utf-8')
          html=html.replace('home-i18n.js?v=20260824-1420','home-i18n.js?v=20260824-1432')
          h.write_text(html,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _includes/home-4.html home-i18n.js _includes/home-5.html
          git commit -m "Move parking FAQ and art into guest guide section"
          git push