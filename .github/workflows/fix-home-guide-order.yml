name: Fix home guide order
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-home-guide-order.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder guest guide cards and bust accordion cache
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('_includes/home-4.html')
          text=p.read_text(encoding='utf-8')
          parking='''<div class="cards" style="grid-template-columns:1fr;margin-bottom:22px"><a class="card" href="parcheggio.html"><div class="card-bg parking" style="background-image:var(--card-parcheggio)"></div><div class="card-icon">🚗</div><div class="card-content"><div class="card-kicker">Informazioni utili</div><h3>Parcheggio</h3><p>Mappa e indicazioni per la sosta vicino a Civico 26.</p><div class="arrow">Guarda la mappa →</div></div></a></div>'''
          guide='''<div class="preview-card"><div class="preview-icon">🔑</div><div><h3>Check-in, Wi‑Fi, acqua, climatizzazione, regole e contatti</h3><p>Tutto ciò che serve prima e durante il soggiorno: raccolta differenziata, autoclave, climatizzazione, regole e numeri utili.</p><a class="maplink" href="soggiorno.html">Apri Guida ospiti →</a></div></div>'''
          if parking+guide not in text:
              raise SystemExit('expected guest guide order not found')
          parking_after=parking.replace('grid-template-columns:1fr;margin-bottom:22px','grid-template-columns:1fr;margin-top:22px')
          text=text.replace(parking+guide,guide+parking_after,1)
          p.write_text(text,encoding='utf-8')

          h=Path('_includes/home-5.html')
          html=h.read_text(encoding='utf-8')
          html=html.replace('<script src="home-accordion.js" defer></script>','<script src="home-accordion.js?v=20260824-1435" defer></script>',1)
          h.write_text(html,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _includes/home-4.html _includes/home-5.html
          git commit -m "Fix guest guide card order and room auto-scroll cache"
          git push
