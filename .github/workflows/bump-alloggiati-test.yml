name: Bump official test script cache
on:
  push:
    paths:
      - '.github/workflows/bump-alloggiati-test.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump script version
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          s=s.replace('admin-alloggiati-official-test.js?v=20260824-1750','admin-alloggiati-official-test.js?v=20260824-2108')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Load updated official Questura test UI'
          git push
