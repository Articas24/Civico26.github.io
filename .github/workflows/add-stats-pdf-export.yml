name: Wire statistics PDF export
on:
  push:
    paths:
      - '.github/workflows/add-stats-pdf-export.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: node --check admin-stats-export.js
      - name: Add loader
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          loader='<script src="admin-stats-export.js?v=20260825-1635"></script>'
          if loader not in s:
              needle='<script src="admin-outlook-sync.js?v=20260825-0640"></script>'
              if needle not in s: raise SystemExit('admin loader anchor not found')
              s=s.replace(needle,needle+'\n'+loader,1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Load statistics PDF export' || exit 0
          git push
