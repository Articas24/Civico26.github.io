name: Ensure guest pages load i18n

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-site-i18n.yml'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared language loader
        run: |
          python - <<'PY'
          from pathlib import Path
          pages = [
              'arte.html','aspromonte.html','faq.html','guida-reggio-calabria.html',
              'mangiare.html','mappa.html','mare.html','parcheggio.html','posizione.html',
              'preferiti.html','reggio.html','soggiorno.html'
          ]
          tag = '<script src="site-i18n.js?v=20260824-1311"></script>'
          changed = []
          for name in pages:
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              if 'site-i18n.js' in text:
                  continue
              if '</body>' in text:
                  text = text.replace('</body>', tag + '\n</body>', 1)
                  p.write_text(text, encoding='utf-8')
                  changed.append(name)
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arte.html aspromonte.html faq.html guida-reggio-calabria.html mangiare.html mappa.html mare.html parcheggio.html posizione.html preferiti.html reggio.html soggiorno.html
          git commit -m "Load persistent language support on guest pages"
          git push
