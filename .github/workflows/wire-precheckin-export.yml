name: Wire pre-check-in exports
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wire-precheckin-export.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire export controls
        run: |
          python - <<'PY'
          from pathlib import Path

          a=Path('admin.html')
          s=a.read_text(encoding='utf-8')
          tag='<script src="admin-precheckin-export.js?v=20260824-1655"></script>'
          if 'admin-precheckin-export.js' not in s:
              marker='<script src="admin-precheckin.js?v=20260824-1603"></script>'
              if marker in s:
                  s=s.replace(marker, marker+'\n'+tag, 1)
              else:
                  s=s.replace('</body></html>', tag+'\n</body></html>', 1)
          a.write_text(s,encoding='utf-8')

          p=Path('precheckin.js')
          j=p.read_text(encoding='utf-8')
          j=j.replace('<option value="other" ${g.document_type===\'other\'?\'selected\':\'\'}>${T(\'other\')}</option>','')
          p.write_text(j,encoding='utf-8')

          h=Path('precheckin.html')
          x=h.read_text(encoding='utf-8')
          x=x.replace('precheckin.js?v=20260824-1603','precheckin.js?v=20260824-1655')
          h.write_text(x,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html precheckin.js precheckin.html
          git commit -m "Enable ROSS1000 and Alloggiati downloads"
          git push
