name: Finalize centro SEO polish
on:
  push:
    paths:
      - '.github/workflows/finalize-centro-seo.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish homepage target and translation cache
        shell: python
        run: |
          from pathlib import Path
          p=Path('_includes/home-1.html'); s=p.read_text()
          s=s.replace('<h1>Civico 26 · Casa vacanze a Reggio Calabria</h1>','<h1>Casa vacanze a Reggio Calabria</h1>',1)
          p.write_text(s)
          p=Path('home-i18n-current-hero-fix.js'); s=p.read_text()
          s=s.replace("['Civico 26 · Casa vacanze a Reggio Calabria','Civico 26 · Holiday apartment in Reggio Calabria']","['Casa vacanze a Reggio Calabria','Holiday apartment in Reggio Calabria']",1)
          p.write_text(s)
          p=Path('_includes/home-5.html'); s=p.read_text()
          s=s.replace('home-i18n-current-hero-fix.js?v=20260825-0635','home-i18n-current-hero-fix.js?v=20260825-1708',1)
          p.write_text(s)
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          h=Path('_includes/home-1.html').read_text()
          assert '<h1>Casa vacanze a Reggio Calabria</h1>' in h
          assert '<title>Civico 26 | Casa vacanze a Reggio Calabria</title>' in h
          i=Path('home-i18n-current-hero-fix.js').read_text()
          assert "['Casa vacanze a Reggio Calabria','Holiday apartment in Reggio Calabria']" in i
          assert 'home-i18n-current-hero-fix.js?v=20260825-1708' in Path('_includes/home-5.html').read_text()
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _includes/home-1.html _includes/home-5.html home-i18n-current-hero-fix.js
          git commit -m 'Polish homepage SEO target and i18n cache'
          git push
