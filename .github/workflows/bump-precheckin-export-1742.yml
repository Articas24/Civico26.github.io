name: Bump pre-check-in export UI 1742
on:
  push:
    paths:
      - '.github/workflows/bump-precheckin-export-1742.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump export UI version
        shell: python
        run: |
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text()
          import re
          s=re.sub(r'admin-precheckin-export\.js\?v=[0-9-]+','admin-precheckin-export.js?v=20260824-1742',s)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Load duplicate-safe pre-check-in export UI'
          git push
