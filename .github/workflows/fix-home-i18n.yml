name: Fix home English translations
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-home-i18n.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make home translations exact and complete location copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('home-i18n.js')
          text=p.read_text(encoding='utf-8')
          anchor='"Nel cuore della città":"In the heart of the city","Una base comoda per vivere Reggio Calabria a piedi e raggiungere facilmente lo Stretto e la Costa Viola.":"A convenient base for exploring Reggio Calabria on foot and reaching the Strait and Costa Viola.","Approfondisci posizione →":"Explore location →","Dove parcheggiare →":"Where to park →","Mare e spiagge →":"Sea and beaches →","Stazione Centrale":"Central Station","Corso Garibaldi":"Corso Garibaldi","1 min a piedi":"1 min walk","5 min a piedi":"5 min walk","7 min a piedi":"7 min walk","10 min a piedi":"10 min walk","Parcheggio":"Parking","Soluzioni gratuite nelle vicinanze":"Free options nearby",'
          replacement='"Nel cuore della città":"In the heart of the city","Una base comoda per vivere Reggio Calabria a piedi e raggiungere facilmente lo Stretto e la Costa Viola.":"A convenient base for exploring Reggio Calabria on foot and reaching the Strait and Costa Viola.","Civico 26 si trova in Via Caprera, nel centro di Reggio Calabria":"Civico 26 is located on Via Caprera, in central Reggio Calabria",". La Stazione Centrale, Corso Garibaldi, il Lungomare Falcomatà e il centro storico sono facilmente raggiungibili a piedi.":". Central Station, Corso Garibaldi, the Falcomatà seafront and the historic centre are all within easy walking distance.","Dalla Stazione Centrale è inoltre possibile raggiungere località della Costa Viola come Scilla e Bagnara. Per chi arriva in auto, nelle vicinanze sono presenti possibilità di sosta gratuita.":"From Central Station you can also reach Costa Viola destinations such as Scilla and Bagnara. If you arrive by car, free parking may be available nearby.","Approfondisci posizione →":"Explore location →","Dove parcheggiare →":"Where to park →","Mare e spiagge →":"Sea and beaches →","Stazione Centrale":"Central Station","Corso Garibaldi":"Corso Garibaldi","Lungomare Falcomatà":"Falcomatà seafront","Duomo":"Cathedral","Castello Aragonese":"Aragonese Castle","1 min a piedi":"1 min walk","5 min a piedi":"5 min walk","7 min a piedi":"7 min walk","10 min a piedi":"10 min walk","Parcheggio":"Parking","Soluzioni gratuite nelle vicinanze":"Free options nearby",'
          if anchor not in text:
              raise SystemExit('location translation anchor not found')
          text=text.replace(anchor,replacement,1)
          old=" let out=core; for(const [it,en] of Object.entries(translations)){if(out.includes(it)) out=out.split(it).join(en)}\n node.nodeValue=leading+out+trailing;"
          new=" node.nodeValue=leading+core+trailing;"
          if old not in text:
              raise SystemExit('unsafe fallback not found')
          text=text.replace(old,new,1)
          footer_key='"Casa vacanze nel centro di Reggio Calabria":"Holiday apartment in central Reggio Calabria",'
          footer_add='"Casa vacanze nel centro di Reggio Calabria":"Holiday apartment in central Reggio Calabria","Casa vacanze nel centro di Reggio Calabria, in Via Caprera 26. Tre camere, due bagni e cucina attrezzata, fino a 8 ospiti.":"Holiday apartment in central Reggio Calabria, at Via Caprera 26. Three bedrooms, two bathrooms and an equipped kitchen, for up to 8 guests.",'
          if footer_key in text and 'at Via Caprera 26' not in text:
              text=text.replace(footer_key,footer_add,1)
          p.write_text(text,encoding='utf-8')

          h=Path('_includes/home-5.html')
          html=h.read_text(encoding='utf-8')
          html=html.replace('home-i18n.js?v=20260821-0955','home-i18n.js?v=20260824-1420')
          h.write_text(html,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-i18n.js _includes/home-5.html
          git commit -m "Fix unsafe English substitutions on home location section"
          git push
